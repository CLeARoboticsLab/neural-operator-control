# ==============================================================================
# HalfCheetah-v3 (iMuJoCo) Environment Configuration
# ==============================================================================
# Locomotion benchmark from Patacchiola et al. (2023): 53 dynamics configurations
# (body mass, limb length, joint range, friction) with offline SAC expert rollouts,
# 100 episodes per configuration. Data is downloaded, not generated:
#   make data-halfcheetah
# State: 17D, Control: 6D. Context = logged (state, action) -> next_state transitions.
# Values below are the ones used for Figures 9 and 10 of the paper.

generator: halfcheetah

# ---------- Data ----------
data:
  env_name: "HalfCheetah-v3"
  train_perc: 0.8                  # 80/20 split over configurations
  split_seed: 42
  normalize: true                  # z-score states/actions with training-set statistics

# ---------- Model ----------
# Same operator as the OCP environments: p=128, 4 hidden layers in phi/rho/trunk,
# attention pooling with 4 heads and 4 tokens. Normalization is done at the data
# level, so the bare SetONet is used (no NormalizedSetONet wrapper).
model:
  p: 128
  phi_hidden_size: 128
  phi_output_size: 128
  rho_hidden_size: 128
  trunk_hidden_size: 128
  n_phi_layers: 4
  n_rho_layers: 4
  n_trunk_layers: 4
  aggregation_type: "attention"
  attention_n_heads: 4
  attention_n_tokens: 4
  use_bias: true
  use_normalization: false

# ---------- Pretraining (behavioral cloning) ----------
# A training sample for one task = K context episodes and K query episodes, each a
# random window of H transitions. K is drawn per iteration from the list.
training:
  num_iterations: 10000
  learning_rate: 1.0e-3
  cosine_decay_alpha: 0.01         # cosine decay to 1% of the base LR
  M: 16                            # tasks per batch
  K: [1, 3, 5]                     # episodes per task (context and query)
  H: 100                           # transitions per episode window
  eval_every: 500
  num_eval_batches: 10
  num_runs: 5                      # best-of-5 by validation loss

# ---------- SetONet Meta-Training ----------
# Inner loop adapts on the context episodes' own (state -> action) pairs; the
# outer loop scores the adapted operator on the query episodes.
setonet_meta:
  inner_lr: 0.01                   # SGD, single inner step
  outer_lr: 5.0e-4                 # Adam
  K: [1, 3, 5]
  H: 100
  num_tasks: 16
  num_iterations: 10000
  eval_every: 500
  num_eval_batches: 10
  num_runs: 5                      # SetONet-Meta (branch-only inner loop)
  num_runs_meta_full: 1            # SetONet-Meta-Full (full inner loop)
  init_from_pretrained: false      # meta-train from a fresh initialisation (as in the paper runs)

# ---------- MAML Baseline ----------
maml:
  inner_lr: 0.01
  outer_lr: 5.0e-4
  K: [1, 3, 5]
  H: 100
  num_tasks: 16
  num_iterations: 10000
  eval_every: 500
  num_eval_batches: 10
  num_runs: 5

maml_model:
  hidden_size: 256
  num_layers: 4

# ---------- Evaluation (Figure 10 grid and Figure 9) ----------
evaluation:
  num_demos_list: [1, 5, 10, 25]   # episodes used for adaptation
  grad_steps_list: [1, 5, 10, 25, 50, 100, 200]
  num_seeds: 5
  H: 100                           # window per episode (adaptation and evaluation)
  setonet_ft_lr: 1.0e-4            # Adam, full-network fine-tuning
  last_layer_lr: 1.0e-4            # Adam, last-layer fine-tuning
  maml_inner_lr: 0.01              # SGD, matches training inner_lr
  setonet_meta_inner_lr: 0.01
  setonet_meta_full_inner_lr: 0.01
  figure9:
    task_idx: 0                    # held-out configuration to plot
    num_demos: 10
    grad_steps: 25
    plot_timesteps: 50
    control_dims: 3
