# ==============================================================================
# P2P-Cost Environment Configuration
# ==============================================================================
# Double integrator with LQR control, multiple goal states.
# State: [x, y, vx, vy] (4D), Control: [ax, ay] (2D)
#
# Each task is defined by a goal state, which determines the cost landscape.
# Source: create_double_integrator_lqr.py

generator: p2p_cost

# ---------- Data Generation ----------
data:
  num_goals: 500                   # Number of goal states (tasks)
  trajectories_per_goal: 100       # Trajectories per goal (matches paper Table 1)
  seed: 42

  horizon: 50                     # Trajectory length in timesteps
  dt: 0.1                         # Time step (seconds)

  workspace:
    goal_range: [-10.0, 10.0]     # Goal position bounds
    state_range: [-10.0, 10.0]    # Starting position bounds
    vel_range: [-5.0, 5.0]        # Starting velocity bounds

  goal_state:
    zero_velocity: true           # Goals have zero velocity

  # LQR cost weights: c(x,u) = (x-x_goal)^T Q (x-x_goal) + u^T R u
  cost_weights:
    Q_weight: 1.0                 # State cost (diagonal Q)
    R_weight: 0.1                 # Control cost (diagonal R)
    Qf_weight: 10.0               # Terminal state cost

# ---------- Model ----------
model:
  p: 128                           # Latent dimension (branch/trunk cross product)
  phi_hidden_size: 128
  phi_output_size: 128
  rho_hidden_size: 128
  trunk_hidden_size: 128
  n_phi_layers: 2
  n_rho_layers: 2
  n_trunk_layers: 2
  aggregation_type: "attention"
  attention_n_heads: 4
  attention_n_tokens: 4
  use_bias: true

# ---------- Training ----------
# Paper protocol (train_setonet_lqr_dataloader.py): stored dataset, on-policy
# context K=128, N=32 expert trajectories in the imitation loss, best-of-10.
training:
  num_iterations: 7500
  learning_rate: 1.0e-3
  M: 32                            # Tasks per training batch
  K: [128]                         # Branch context size (on-policy transitions)
  N: 32                            # Expert trajectories in the imitation loss
  eval_every: 100
  num_eval_tasks: 20
  num_runs: 10                     # paper best-of-10 (run 1 to validate)
  train_perc: 0.8
  # Sampling ranges (used by the transfer-task eval generator, not training)
  goal_range: [-10.0, 10.0]
  state_range: [-10.0, 10.0]
  src_vel_range: [-10.0, 10.0]
  src_control_range: [-5.0, 5.0]

# ---------- SetONet Meta-Training ----------
setonet_meta:
  inner_lr: 0.01
  outer_lr: 0.001
  K_support: 64
  K_query: 64
  N_support: 4
  N_query: 4
  num_tasks: 16
  num_iterations: 5000
  eval_every: 100
  num_eval_batches: 10

# ---------- MAML Baseline ----------
maml:
  inner_lr: 0.01
  outer_lr: 0.001
  K_support: 64
  K_query: 8
  num_tasks: 16
  num_iterations: 5000
  eval_every: 100
  num_eval_batches: 10

maml_model:
  hidden_size: 128
  num_layers: 16

# ---------- Evaluation ----------
# evaluation:
#   ...

# ---------- Task-Conditioned MLP Baseline ----------
# Shallow + wide (trainable) MLP, parameter-comparable to the SetONet operator.
baseline_model:
  hidden_size: 288
  num_layers: 4
