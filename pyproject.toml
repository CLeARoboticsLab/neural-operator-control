[project]
name = "setonet"
version = "0.1.0"
description = "Multi-Task Operator Learning for Control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core ML framework
    # Pinned to 0.6.2: jaxlib < 0.5 cannot target Blackwell GPUs (sm_120, e.g. RTX 50xx) —
    # its XLA caps codegen at sm_90a, which ptxas refuses to forward-compile to sm_120.
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "equinox==0.13.8",
    "optax==0.2.8",
    "jaxtyping==0.3.7",

    # Optimal control solvers
    "casadi==3.6.5",                  # IPOPT (obstacle avoidance)
    "trajax @ git+https://github.com/google/trajax",  # tvLQR (P2P-Cost)

    # Data and plotting
    "numpy==1.26.4",
    "matplotlib==3.9.0",
    "scipy==1.13.1",
    "pyyaml==6.0.1",

    # Utilities
    "tqdm==4.66.4",
    "python-dotenv==1.0.1",          # src/__init__.py load_dotenv()
]

[project.optional-dependencies]
# GPU support — install with: pip install ".[cuda]"
cuda = [
    "jax[cuda12]==0.6.2",
]

# iMuJoCo environments — install with: pip install ".[imujoco]"
imujoco = [
    "mujoco==3.1.6",
    "gymnasium[mujoco]==0.29.1",
    "stable-baselines3==2.3.2",
]

# Logging and visualization (not required for reproduction)
dev = [
    "tensorboard==2.16.1",
    "ipython",
    "black",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------- Tool configuration ----------

[tool.uv]
# jax 0.6.2 pulls ml-dtypes>=0.5.0, which *declares* numpy>=2.1.0. That floor is
# overly conservative — the stack runs correctly on numpy 1.26.4 at runtime, and
# numpy 1.x is required for the numpy-1.x-ABI deps here (casadi 3.6.5). Override
# the transitive floor so the lock matches the validated environment.
override-dependencies = ["numpy==1.26.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]
