baseline_model:
  hidden_size: 288
  num_layers: 4
data:
  cost_weights:
    Q_weight: 1.0
    Qf_weight: 10.0
    R_weight: 0.1
  dt: 0.1
  goal_state:
    zero_velocity: true
  horizon: 50
  num_goals: 50
  seed: 42
  trajectories_per_goal: 10
  workspace:
    goal_range:
    - -10.0
    - 10.0
    state_range:
    - -10.0
    - 10.0
    vel_range:
    - -5.0
    - 5.0
generator: p2p_cost
maml:
  K_query: 8
  K_support: 64
  eval_every: 50
  inner_lr: 0.01
  num_eval_batches: 10
  num_iterations: 500
  num_tasks: 16
  outer_lr: 0.001
maml_model:
  hidden_size: 128
  num_layers: 16
model:
  aggregation_type: attention
  attention_n_heads: 4
  attention_n_tokens: 4
  n_phi_layers: 2
  n_rho_layers: 2
  n_trunk_layers: 2
  p: 128
  phi_hidden_size: 128
  phi_output_size: 128
  rho_hidden_size: 128
  trunk_hidden_size: 128
  use_bias: true
setonet_meta:
  K_query: 64
  K_support: 64
  N_query: 4
  N_support: 4
  eval_every: 50
  inner_lr: 0.01
  num_eval_batches: 5
  num_iterations: 500
  num_tasks: 8
  outer_lr: 0.001
training:
  K:
  - 128
  M: 32
  N: 10
  eval_every: 100
  goal_range:
  - -10.0
  - 10.0
  learning_rate: 0.001
  num_eval_tasks: 10
  num_iterations: 7500
  num_runs: 1
  src_control_range:
  - -5.0
  - 5.0
  src_vel_range:
  - -10.0
  - 10.0
  state_range:
  - -10.0
  - 10.0
  train_perc: 0.8
