baseline_model:
  hidden_size: 320
  num_layers: 4
data:
  cost_weights:
    angle_weight: 50.0
    angular_velocity_weight: 5.0
    control_weight: 0.1
    position_weight: 10.0
    terminal_angle_weight: 100.0
    terminal_position_weight: 100.0
    terminal_velocity_weight: 50.0
    velocity_weight: 1.0
  dt: 0.02
  dynamics_ranges:
    arm_length_range:
    - 0.05
    - 0.15
    inertia_scale_range:
    - 0.8
    - 1.2
    mass_range:
    - 0.1
    - 0.5
    max_torque: 0.1
  goal_state:
    fixed_position:
    - 0.0
    - 1.5
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    num_goals: 1
    type: fixed
  horizon: 100
  max_iterations: 150
  num_dynamics_configs: 100
  num_trajectories_per_task: 20
  seed: 42
  start_state:
    phi_dot_range:
    - -0.5
    - 0.5
    phi_range:
    - -0.3
    - 0.3
    velocity_range:
    - -0.5
    - 0.5
  workspace:
    y_range:
    - -2.0
    - 2.0
    z_range:
    - 0.5
    - 3.0
generator: quadrotor
maml:
  K_query: 32
  K_support: 64
  eval_every: 100
  goal_idx: 0
  inner_lr: 0.01
  num_eval_batches: 10
  num_iterations: 1000
  num_tasks: 16
  outer_lr: 0.001
maml_model:
  hidden_size: 128
  num_layers: 17
model:
  aggregation_type: attention
  attention_n_heads: 4
  attention_n_tokens: 4
  n_phi_layers: 3
  n_rho_layers: 3
  n_trunk_layers: 3
  p: 64
  phi_hidden_size: 128
  phi_output_size: 128
  rho_hidden_size: 128
  trunk_hidden_size: 128
  use_bias: true
setonet_meta:
  K: 64
  N: 5
  eval_every: 100
  goal_idx: 0
  inner_lr: 0.01
  num_eval_batches: 10
  num_iterations: 1000
  num_tasks: 16
  outer_lr: 0.001
training:
  K: 64
  M: 16
  N: 5
  eval_every: 100
  learning_rate: 0.001
  num_iterations: 2000
  num_runs: 1
