baseline_model:
  hidden_size: 320
  num_layers: 4
data:
  cost_weights:
    control_weight: 0.01
    position_weight: 1.0
    terminal_position_weight: 20.0
    terminal_velocity_weight: 10.0
    velocity_weight: 0.5
  dt: 0.1
  dynamics_ranges:
    friction_range:
    - 0.3
    - 0.9
    max_acceleration_range:
    - 3.0
    - 5.0
    max_velocity_range:
    - 10.0
    - 15.0
  goal_state:
    grid_num_x: 5
    grid_num_y: 5
    num_goals: 1
    speed_range:
    - 0.0
    - 0.0
    type: random
    zero_velocity: true
  horizon: 30
  max_iterations: 100
  num_dynamics_configs: 100
  num_trajectories_per_task: 100
  seed: 42
  start_state:
    speed_range:
    - 0.0
    - 0.0
  workspace:
    x_range:
    - -5.0
    - 5.0
    y_range:
    - -5.0
    - 5.0
generator: p2p_dynamics
maml:
  N_query: 8
  N_support: 8
  eval_every: 100
  goal_idx: 0
  inner_lr: 0.01
  num_eval_batches: 10
  num_iterations: 1500
  num_tasks: 16
  outer_lr: 0.001
maml_model:
  hidden_size: 128
  num_layers: 17
model:
  aggregation_type: attention
  attention_n_heads: 4
  attention_n_tokens: 1
  n_phi_layers: 4
  n_rho_layers: 4
  n_trunk_layers: 4
  p: 32
  phi_hidden_size: 128
  phi_output_size: 128
  rho_hidden_size: 128
  trunk_hidden_size: 128
  use_bias: true
  use_normalization: true
setonet_meta:
  K: 32
  N_query: 8
  N_support: 8
  eval_every: 100
  goal_idx: 0
  inner_lr: 0.01
  num_eval_batches: 10
  num_iterations: 1500
  num_tasks: 16
  outer_lr: 0.001
training:
  K:
  - 16
  - 32
  - 64
  - 128
  M: 32
  N: 16
  cosine_decay_alpha: 0.01
  eval_every: 100
  grad_clip_norm: 1.0
  learning_rate: 0.0005
  num_iterations: 15000
  num_runs: 1
